name: Validate published build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: Static distribution integrity
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate published artifacts
        run: node --test tests/static-build.test.mjs
      - name: Generate read-only module inventory
        run: |
          node scripts/inventory-bundle.mjs > bundle-inventory.json
          node -e "const x = require('./bundle-inventory.json'); if (x.jsChunks < 1 || x.chunks.length !== x.jsChunks) process.exit(1)"


