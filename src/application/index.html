<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sumiro</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body { background: #282623; color: #f5f0e7; font: 1rem system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; }
    [role="status"] { position: fixed; inset: auto 1rem 1rem; max-width: 50ch; padding: .8rem 1rem; background: #282623; white-space: pre-line; pointer-events: none; }
    .menu { position: fixed; inset: 0; display: grid; place-content: center; gap: .6rem; padding: 1rem; background: #26231fe8; }
    .menu[hidden] { display: none; }
    h1, h2 { margin: 0 0 1rem; font: normal clamp(2.5rem, 9vw, 5rem) Georgia, serif; }
    button { padding: .7rem 1rem; color: inherit; background: #34302a; border: 1px solid #8d8272; font: inherit; }
    button:not(:disabled) { cursor: pointer; }
    button:focus-visible { outline: 2px solid #decda7; outline-offset: 3px; }
    button:disabled { opacity: .5; }
    #pause-button { position: fixed; inset: 1rem 1rem auto auto; }
    #vitals { position: fixed; inset: 1rem auto auto 1rem; pointer-events: none; filter: drop-shadow(0 0 .3rem #e7dcc1); }
    #vitals > div { display: flex; gap: .4rem; align-items: center; }
    #vitals img { width: auto; height: var(--icon-size); }
    #vitals .spent { opacity: .28; }
    .vital-strokes { --icon-size: 1.1rem; }
    .vital-drinks { --icon-size: 1.75rem; margin-top: .4rem; }
    #credits { position: fixed; inset: 0; overflow: hidden; text-align: center; background: #11100e; color: #e7dcc1; font: italic clamp(1rem, 2.7vh, 1.65rem)/1.55 Georgia, serif; }
    #credits h2 { margin: 2.5rem 0 .5rem; font: normal .85em Georgia, serif; letter-spacing: .13em; text-transform: uppercase; }
    #credits p { margin: .35rem 0; }
    #credits button { position: absolute; bottom: 1.25rem; right: 1.25rem; }
    .credit-roll { position: absolute; inset: 100% 0 auto; max-width: 54rem; margin: auto; padding: 1.25rem; }
    .credit-roll.stationary { inset: 0 0 5rem; overflow: auto; }
    .credit-roll span, .credit-roll small { opacity: .7; margin: 0 .75em; }
    .credit-roll strong { font-weight: normal; }
    .credit-end { position: absolute; inset: 0; display: grid; place-content: center; padding: 1rem; }
    .credit-end[hidden] { display: none; }
    #credits .credit-end h2 { margin: 0 0 1rem; font: normal clamp(2.5rem, 9vw, 5rem) Georgia, serif; text-transform: none; }
  </style>
  <script type="importmap">
    {"imports": {
      "three": "../node_modules/three/build/three.module.js",
      "three/webgpu": "../node_modules/three/build/three.webgpu.js",
      "three/tsl": "../node_modules/three/build/three.tsl.js",
      "three/addons/": "../node_modules/three/examples/jsm/"
    }}
  </script>
  <script type="module" src="./application/browser.mjs"></script>
</head>
<body>
  <canvas tabindex="0" aria-label="Sumiro game view"></canvas>
  <section class="menu" id="title" aria-labelledby="game-title" hidden>
    <h1 id="game-title">Sumiro</h1>
    <button type="button" id="continue">Continue</button>
    <button type="button" id="new-run">New game</button>
  </section>
  <div id="vitals" role="group" hidden></div>
  <button type="button" id="pause-button" hidden>Pause</button>
  <section class="menu" id="pause-menu" aria-labelledby="pause-heading" hidden>
    <h2 id="pause-heading">Paused</h2>
    <button type="button" id="resume">Resume</button>
    <button type="button" id="restart-checkpoint">Restart from shrine</button>
    <button type="button" id="return-to-title">Quit to title</button>
  </section>
  <p role="status" hidden></p>
  <section id="credits" aria-label="Credits" hidden>
    <div class="credit-roll" hidden></div>
    <div class="credit-end" hidden>
      <h2>Sumiro</h2>
      <p>The road goes on past this page.<br>The rest of it is still wet.</p>
    </div>
    <button type="button" id="advance-credits">Skip credits</button>
  </section>
</body>
</html>
